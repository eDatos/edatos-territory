<p-tree [value]="tree" (onNodeExpand)="onNodeExpand($event)">
    <ng-template let-node pTemplate="default">
        <i *ngIf="node.loading" aria-hidden="true" class="fa fa-spin fa-spinner"></i>
        {{ node.label }}
    </ng-template>
    <ng-template let-node pTemplate="subject-area">
        <i *ngIf="!node.loading" aria-hidden="true" class="fa fa-regular fa-folder"></i>
        <i *ngIf="node.loading" aria-hidden="true" class="fa fa-spin fa-spinner"></i>
        {{ node.label }}
    </ng-template>
    <ng-template let-node pTemplate="operation">
        <i *ngIf="!node.loading" aria-hidden="true" class="fa fa-regular fa-folder"></i>
        <i *ngIf="node.loading" aria-hidden="true" class="fa fa-spin fa-spinner"></i>
        {{ node.label }}
    </ng-template>
    <ng-template let-node pTemplate="collection">
        <i *ngIf="!node.loading" aria-hidden="true" class="fa fa-regular fa-folder"></i>
        <i *ngIf="node.loading" aria-hidden="true" class="fa fa-spin fa-spinner"></i>
        {{ node.label }}
    </ng-template>
    <ng-template let-node pTemplate="collection-node">
        <i *ngIf="!node.loading" aria-hidden="true" class="fa fa-regular fa-folder"></i>
        <i *ngIf="node.loading" aria-hidden="true" class="fa fa-spin fa-spinner"></i>
        {{ node.label }}
    </ng-template>
    <ng-template let-node pTemplate="dataset">
        <a class="underline-link" [href]="getVisualizerUrl(node.data)" target="_blank" (click)="registerMatomo($event)">
            <span aria-hidden="true" class="fa fa-table"></span>
            {{ node.label }}
        </a>
    </ng-template>
    <ng-template let-node pTemplate="empty">
        <span>{{ "territory.operations-tree.empty" | translate }}</span>
    </ng-template>
</p-tree>
