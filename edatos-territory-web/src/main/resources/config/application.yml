spring:
  application:
    name: edatos-territory
  profiles:
    active: @spring.profiles.active@
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  thymeleaf:
    prefix: classpath:/static/
  web:
    resources:
      static-locations:
        - file:/data/edatos/territory/conf/static/
        - classpath:/static/
